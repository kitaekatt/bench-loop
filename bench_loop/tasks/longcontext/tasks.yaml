tasks:
  - id: longcontext-2k-early
    suite: longcontext
    title: "2K retrieval: early needle"
    difficulty: easy
    capability_tags: [long-context, retrieval, 2k]
    messages:
      - role: user
        content: |
          Read the archive below. Ignore routine checksums. What is Project Aurora's access code?
          Return only the access code.

          {{CONTEXT}}
    config: {max_tokens: 32, temperature: 0.0}
    validation: {expected: "AURORA-2K-7319"}
    metadata: {target_context_tokens: 2048, needle_position: 0.1}

